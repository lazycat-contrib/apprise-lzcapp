application:
  subdomain: apprise
  upstreams:
    - location: /
      backend: http://apprise:8000/
  public_path:
    - /
services:
  apprise:
    # upstream: caronc/apprise:v2.0.0
    image: docker.1ms.run/caronc/apprise:v2.0.0
    environment:
      - APPRISE_STATEFUL_MODE=simple
      - APPRISE_WORKER_COUNT={{.U.worker_count}}
      - APPRISE_ADMIN={{.U.enable_admin}}
    binds:
      - /lzcapp/var/config:/config
      - /lzcapp/var/plugin:/plugin
      - /lzcapp/var/attach:/attach
